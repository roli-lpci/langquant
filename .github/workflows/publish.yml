name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish the release artifact
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              package_version = tomllib.load(stream)["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if package_version != tag_version:
              raise SystemExit(
                  f"release tag {tag_version!r} does not match package version {package_version!r}"
              )
          PY

      - name: Install validation tooling
        run: python -m pip install -e ".[dev]"

      - name: Run release checks
        run: |
          ruff check .
          python -m pytest -q

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/langquant-release"
          "$RUNNER_TEMP/langquant-release/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/langquant-release/bin/python" -c "from langquant import ConversationState, LangQuantSession"
          "$RUNNER_TEMP/langquant-release/bin/python" -m langquant --help
          "$RUNNER_TEMP/langquant-release/bin/langquant" --help
          "$RUNNER_TEMP/langquant-release/bin/langquant" --version

      - name: Publish to PyPI through trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
